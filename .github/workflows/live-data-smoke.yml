name: Live Data Smoke Check

on:
  push:
    branches:
      - main
    paths:
      - "scripts/live_data_smoke.py"
      - "backend/app/data/binance_spot.py"
      - "backend/app/data/crypto_spot.py"
      - "backend/app/data/tsetmc_equity.py"
      - "backend/app/analysis/strategy_baseline.py"
      - "backend/app/backtest/**"
      - ".github/workflows/live-data-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Probe public market-data providers
        run: python scripts/live_data_smoke.py

      - name: Upload live provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-data-diagnostics
          path: artifacts/tsetmc-live-probe.json
          if-no-files-found: warn
          retention-days: 7
